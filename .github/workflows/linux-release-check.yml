name: Clean Linux release acceptance
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to verify
        required: true
        type: string
      sha256:
        description: Expected SHA-256 of the Linux archive
        required: true
        type: string
permissions:
  contents: read
jobs:
  fresh-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download the exact draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          mkdir "$RUNNER_TEMP/workbench-assets"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'workbench-standard-linux-amd64.tar.gz*' --dir "$RUNNER_TEMP/workbench-assets"
          cd "$RUNNER_TEMP/workbench-assets"
          sha256sum -c workbench-standard-linux-amd64.tar.gz.sha256
          printf '%s  workbench-standard-linux-amd64.tar.gz\n' "$EXPECTED_SHA256" | sha256sum -c
      - name: Install from scratch and verify the installed product
        run: bash acceptance/linux.sh "$RUNNER_TEMP/workbench-assets/workbench-standard-linux-amd64.tar.gz"
